<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1800" viewBox="0 0 1200 1800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hero product mock">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf8fb"/>
    </linearGradient>
    <radialGradient id="glass" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(234,248,251,0.3)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#g1)" />

  <!-- Soft glass circles -->
  <circle cx="220" cy="220" r="180" fill="url(#glass)" filter="url(#blur)" opacity="0.9" />
  <circle cx="980" cy="1500" r="240" fill="url(#glass)" opacity="0.7" />

  <!-- Decorative large pale circle -->
  <g opacity="0.18">
    <circle cx="600" cy="900" r="300" fill="#dff3f7" />
  </g>

  <!-- Bottles / silhouettes (minimal, elegant) -->
  <g transform="translate(160,520)">
    <!-- Tall pump bottle -->
    <g>
      <rect x="0" y="0" width="140" height="420" rx="18" fill="#ffffff" stroke="#e6f6fb" stroke-width="1" />
      <rect x="48" y="-28" width="44" height="28" rx="6" fill="#ffffff" stroke="#e6f6fb" stroke-width="1" />
    </g>

    <!-- Serum bottle -->
    <g transform="translate(190,50)">
      <rect x="0" y="120" width="100" height="300" rx="14" fill="#ffffff" stroke="#e6f6fb" stroke-width="1" />
      <circle cx="50" cy="80" r="34" fill="#ffffff" stroke="#e6f6fb" stroke-width="1" />
    </g>

    <!-- Supplement bottle -->
    <g transform="translate(350,80)">
      <rect x="0" y="80" width="110" height="340" rx="14" fill="#ffffff" stroke="#e6f6fb" stroke-width="1" />
    </g>

    <!-- Protein pouch -->
    <g transform="translate(520,140)">
      <path d="M0 0 h160 v380 q-40 24 -80 24 q-40 0 -80 -24 z" fill="#ffffff" stroke="#e6f6fb" stroke-width="1" />
    </g>

    <!-- Functional drink can -->
    <g transform="translate(720,180)">
      <rect x="0" y="20" width="80" height="300" rx="14" fill="#ffffff" stroke="#e6f6fb" stroke-width="1" />
    </g>
  </g>

  <!-- Subtle highlight lines to suggest glass -->
  <g stroke="rgba(255,255,255,0.9)" stroke-width="3" stroke-linecap="round">
    <path d="M220 560 q40 -80 120 -80" opacity="0.45" />
    <path d="M420 640 q40 -80 120 -80" opacity="0.32" />
  </g>

  <!-- Footer small watermark / brand hint -->
  <text x="40" y="1740" fill="#cfeff4" font-family="Arial, Helvetica, sans-serif" font-size="18">Paninkret Japan — product mock</text>
</svg>
